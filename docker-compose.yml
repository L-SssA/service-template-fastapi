services:
  redis:
    image: redis:8.8.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # version 17-
      # - ./postgres_data:/var/lib/postgresql/data
      # version 18+
      - ./postgres_data:/var/lib/postgresql

  api_server:
    build:
      context: .
    image: server-image
    container_name: api-server
    restart: unless-stopped
    ports:
      - "8800:8800"
    volumes:
      - ./:/app
    depends_on:
      - redis
      - postgres
    environment:
      - ENV=prod
    command: ["python", "api_server.py"]

  celery_server:
    build:
      context: .
    image: server-image
    container_name: celery-server
    restart: unless-stopped
    volumes:
      - ./:/app
    depends_on:
      - redis
      - postgres
    environment:
      - ENV=prod
    command: ["python", "./celery_server.py"]
