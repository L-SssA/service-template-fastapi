[service]
listen_host = "0.0.0.0"
listen_port = 8800
log_level = "info"
reload_debug = true

[sql]
host = "localhost"
port = 5432
username = ""
password = ""
dbname = "mypostgres"

[redis]
host = "localhost"
port = 6379
db = 0
jti_expiry_seconds = 3600

[celery]
broker_url = "redis://localhost:6379/0"
result_backend = "redis://localhost:6379/1"
task_serializer = "json"
result_serializer = "json"
accept_content = ["json"]
timezone = "Asia/Shanghai"
enable_utc = true

[auth]
jwt_secret = ""
jwt_algorithm = "HS256"
jwt_expiry_seconds = 3600
jwt_refresh_expiry_seconds = 86400

[mail]
mail_username = ""
mail_password = ""
mail_server = "smtp.qq.com"
mail_port = 465
mail_from_email = ""
mail_from_name = "FastAPI"
